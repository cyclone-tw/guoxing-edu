<!DOCTYPE html>
<html lang="zh-TW" x-data="app()" x-init="init()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國姓鄉時空探險隊 - UDL 互動學習教材</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0D9488',
                        secondary: '#2DD4BF',
                        cta: '#EA580C',
                        background: '#F0FDFA',
                        textMain: '#134E4A',
                        chinese: '#EC4899',
                        math: '#3B82F6',
                        social: '#F97316',
                        science: '#22C55E',
                    },
                    fontFamily: {
                        heading: ['Baloo 2', 'cursive'],
                        body: ['Comic Neue', 'cursive'],
                    },
                }
            }
        }
    </script>

    <style>
        /* Claymorphism 樣式 */
        .clay-card {
            background: white;
            border-radius: 24px;
            border: 3px solid #134E4A;
            box-shadow:
                6px 6px 0px #134E4A,
                inset 0 -4px 0px rgba(0,0,0,0.1);
            transition: all 0.2s ease-out;
        }

        .clay-card:hover {
            transform: translateY(-4px);
            box-shadow:
                8px 8px 0px #134E4A,
                inset 0 -4px 0px rgba(0,0,0,0.1);
        }

        .clay-card:active {
            transform: translateY(2px);
            box-shadow:
                2px 2px 0px #134E4A,
                inset 0 -4px 0px rgba(0,0,0,0.1);
        }

        .clay-button {
            border-radius: 16px;
            border: 3px solid currentColor;
            box-shadow:
                4px 4px 0px currentColor,
                inset 0 -3px 0px rgba(0,0,0,0.15);
            transition: all 0.15s ease-out;
            cursor: pointer;
        }

        .clay-button:hover {
            transform: translateY(-2px);
            box-shadow:
                6px 6px 0px currentColor,
                inset 0 -3px 0px rgba(0,0,0,0.15);
        }

        .clay-button:active {
            transform: translateY(2px);
            box-shadow:
                2px 2px 0px currentColor,
                inset 0 -3px 0px rgba(0,0,0,0.15);
        }

        /* 選項按鈕樣式 */
        .option-button {
            background: white;
            border: 3px solid #134E4A;
            border-radius: 16px;
            box-shadow: 4px 4px 0px #134E4A;
            transition: all 0.15s ease-out;
            cursor: pointer;
        }

        .option-button:hover {
            background: #F0FDFA;
            transform: translateY(-2px);
            box-shadow: 6px 6px 0px #134E4A;
        }

        .option-button:active {
            transform: translateY(2px);
            box-shadow: 2px 2px 0px #134E4A;
        }

        .option-button.correct {
            background: #DCFCE7;
            border-color: #22C55E;
            box-shadow: 4px 4px 0px #22C55E;
        }

        .option-button.wrong {
            background: #FEF2F2;
            border-color: #EF4444;
            box-shadow: 4px 4px 0px #EF4444;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* 慶祝動畫 */
        @keyframes celebrate {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .celebrate {
            animation: celebrate 0.5s ease-out;
        }

        /* 進度條 */
        .progress-bar {
            background: #E2E8F0;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #0D9488, #2DD4BF);
            height: 100%;
            border-radius: 999px;
            transition: width 0.5s ease-out;
        }

        /* 字體大小設定 */
        .font-size-small { font-size: 0.875rem; }
        .font-size-medium { font-size: 1rem; }
        .font-size-large { font-size: 1.25rem; }

        /* 無障礙焦點樣式 */
        *:focus-visible {
            outline: 4px solid #2DD4BF;
            outline-offset: 2px;
        }

        /* 減少動畫偏好 */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* 學科卡片顏色 */
        .subject-chinese {
            background: linear-gradient(135deg, #FDF2F8, #FCE7F3);
            border-color: #EC4899;
        }
        .subject-math {
            background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
            border-color: #3B82F6;
        }
        .subject-social {
            background: linear-gradient(135deg, #FFF7ED, #FFEDD5);
            border-color: #F97316;
        }
        .subject-science {
            background: linear-gradient(135deg, #F0FDF4, #DCFCE7);
            border-color: #22C55E;
        }

        /* 語音按鈕動畫 */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .listening {
            animation: pulse 1s ease-in-out infinite;
            background: #EF4444 !important;
        }
    </style>
</head>
<body class="bg-background min-h-screen font-body text-textMain" :class="'font-size-' + settings.fontSize">

    <!-- 主要內容區域 -->
    <main class="min-h-screen pb-8">

        <!-- ===== 首頁：地點選擇 ===== -->
        <template x-if="currentPage === 'home'">
            <div class="px-4 py-6 max-w-4xl mx-auto">
                <!-- 標題列 -->
                <header class="flex items-center justify-between mb-6">
                    <button
                        @click="showSettings = true"
                        class="clay-button bg-white text-primary p-3"
                        aria-label="設定"
                    >
                        <i data-lucide="settings" class="w-6 h-6"></i>
                    </button>

                    <h1 class="font-heading text-2xl md:text-3xl font-bold text-primary text-center">
                        國姓鄉時空探險隊
                    </h1>

                    <button
                        @click="showBadges = true"
                        class="clay-button bg-white text-cta p-3"
                        aria-label="我的徽章"
                    >
                        <i data-lucide="award" class="w-6 h-6"></i>
                    </button>
                </header>

                <!-- 歡迎訊息 -->
                <div class="clay-card p-4 mb-6 text-center" x-show="settings.studentName">
                    <p class="text-xl">
                        <span class="text-2xl">👋</span>
                        你好，<span class="font-bold text-primary" x-text="settings.studentName"></span>！
                        準備好探險了嗎？
                    </p>
                </div>

                <!-- 難度選擇 -->
                <div class="flex justify-center gap-2 mb-6">
                    <template x-for="level in ['basic', 'intermediate', 'challenge']" :key="level">
                        <button
                            @click="settings.difficulty = level; saveSettings()"
                            class="clay-button px-4 py-2 text-lg transition-all"
                            :class="settings.difficulty === level ? 'bg-primary text-white' : 'bg-white text-textMain'"
                        >
                            <span x-text="difficultyLabels[level]"></span>
                        </button>
                    </template>
                </div>

                <!-- 地點卡片網格 -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <template x-for="location in locations" :key="location.id">
                        <button
                            @click="selectLocation(location)"
                            class="clay-card p-4 text-center cursor-pointer focus:outline-none"
                            :aria-label="location.name"
                        >
                            <!-- 地點圖示 -->
                            <div class="text-5xl mb-2" x-text="location.icon"></div>

                            <!-- 地點名稱 -->
                            <h2 class="font-heading font-bold text-lg mb-2" x-text="location.name"></h2>

                            <!-- 完成狀態 -->
                            <div x-show="isLocationCompleted(location.id)" class="text-science font-bold">
                                <i data-lucide="check-circle" class="w-5 h-5 inline"></i>
                                完成！
                            </div>
                            <div x-show="getLocationProgress(location.id) > 0 && !isLocationCompleted(location.id)" class="text-cta">
                                進行中
                            </div>
                        </button>
                    </template>
                </div>

                <!-- 總進度條 -->
                <div class="clay-card p-4">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-heading font-bold">總進度</span>
                        <span class="font-bold text-primary" x-text="getOverallProgress() + '/' + locations.length + ' 地點完成'"></span>
                    </div>
                    <div class="progress-bar h-4">
                        <div class="progress-fill" :style="'width: ' + (getOverallProgress() / locations.length * 100) + '%'"></div>
                    </div>
                </div>
            </div>
        </template>

        <!-- ===== 地點詳情頁 ===== -->
        <template x-if="currentPage === 'location'">
            <div class="px-4 py-6 max-w-2xl mx-auto">
                <!-- 導航列 -->
                <header class="flex items-center justify-between mb-6">
                    <button
                        @click="currentPage = 'home'"
                        class="clay-button bg-white text-primary px-4 py-2 flex items-center gap-2"
                    >
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        返回地圖
                    </button>

                    <div class="clay-button bg-primary text-white px-4 py-2">
                        <span x-text="difficultyLabels[settings.difficulty]"></span>
                    </div>
                </header>

                <!-- 地點資訊卡片 -->
                <div class="clay-card overflow-hidden mb-6">
                    <!-- 圖片區域 -->
                    <div class="h-48 bg-gradient-to-br from-primary/20 to-secondary/20 flex items-center justify-center">
                        <span class="text-8xl" x-text="selectedLocation.icon"></span>
                    </div>

                    <!-- 文字資訊 -->
                    <div class="p-6">
                        <h1 class="font-heading text-2xl font-bold mb-2" x-text="selectedLocation.name"></h1>
                        <p class="text-lg mb-4" x-text="selectedLocation.description"></p>

                        <button
                            @click="speakText(selectedLocation.description)"
                            class="clay-button bg-secondary text-white px-4 py-2 flex items-center gap-2"
                        >
                            <i data-lucide="volume-2" class="w-5 h-5"></i>
                            聽介紹
                        </button>
                    </div>
                </div>

                <!-- 學科選擇 -->
                <h2 class="font-heading text-xl font-bold mb-4 text-center">選擇學科開始學習</h2>

                <div class="grid grid-cols-2 gap-4">
                    <template x-for="subject in subjects" :key="subject.id">
                        <button
                            @click="selectSubject(subject)"
                            class="clay-card p-6 text-center cursor-pointer"
                            :class="'subject-' + subject.id"
                        >
                            <div class="text-4xl mb-2" x-text="subject.icon"></div>
                            <h3 class="font-heading font-bold text-xl mb-2" x-text="subject.name"></h3>

                            <!-- 完成狀態 -->
                            <div x-show="isSubjectCompleted(selectedLocation.id, subject.id)" class="text-science font-bold text-sm">
                                <i data-lucide="check" class="w-4 h-4 inline"></i> 已完成
                            </div>
                        </button>
                    </template>
                </div>
            </div>
        </template>

        <!-- ===== 答題頁 ===== -->
        <template x-if="currentPage === 'quiz'">
            <div class="px-4 py-6 max-w-2xl mx-auto">
                <!-- 導航列 -->
                <header class="flex items-center justify-between mb-6">
                    <button
                        @click="currentPage = 'location'"
                        class="clay-button bg-white text-primary px-4 py-2 flex items-center gap-2"
                    >
                        <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        返回
                    </button>

                    <div class="text-center">
                        <span class="font-heading font-bold" x-text="selectedLocation.name"></span>
                        <span class="mx-2">-</span>
                        <span :class="'text-' + selectedSubject.id" x-text="selectedSubject.name"></span>
                    </div>

                    <div class="clay-button bg-primary text-white px-3 py-2 text-sm">
                        <span x-text="difficultyLabels[settings.difficulty]"></span>
                    </div>
                </header>

                <!-- 題目卡片 -->
                <div class="clay-card p-6 mb-6">
                    <!-- 朗讀按鈕 -->
                    <button
                        @click="speakText(currentQuestion.question)"
                        class="clay-button bg-secondary text-white px-4 py-2 mb-4 flex items-center gap-2"
                    >
                        <i data-lucide="volume-2" class="w-5 h-5"></i>
                        再聽一次
                    </button>

                    <!-- 題目文字 -->
                    <p class="text-2xl md:text-3xl font-bold leading-relaxed" x-text="currentQuestion.question"></p>
                </div>

                <!-- 選項區 -->
                <div class="space-y-4 mb-6" x-show="!showResult">
                    <template x-for="(option, index) in currentQuestion.options" :key="index">
                        <button
                            @click="checkAnswer(index)"
                            class="option-button w-full p-5 text-left flex items-center gap-4"
                            :class="{
                                'correct': selectedAnswer === index && isCorrect,
                                'wrong': selectedAnswer === index && !isCorrect && selectedAnswer !== null
                            }"
                            :disabled="selectedAnswer !== null"
                        >
                            <span class="clay-button bg-primary text-white w-12 h-12 flex items-center justify-center text-xl font-bold shrink-0">
                                <span x-text="index + 1"></span>
                            </span>
                            <span class="text-xl md:text-2xl" x-text="option"></span>
                        </button>
                    </template>
                </div>

                <!-- 語音作答按鈕 -->
                <button
                    @click="startVoiceRecognition()"
                    class="clay-button w-full py-4 flex items-center justify-center gap-3 mb-4"
                    :class="isListening ? 'listening text-white' : 'bg-cta text-white'"
                    x-show="!showResult"
                >
                    <i data-lucide="mic" class="w-6 h-6"></i>
                    <span x-text="isListening ? '正在聆聽...' : '說出答案'"></span>
                </button>

                <!-- 提示文字 -->
                <p class="text-center text-gray-500 mb-4" x-show="!showResult">
                    <i data-lucide="keyboard" class="w-4 h-4 inline"></i>
                    提示：按數字鍵 1、2、3 也可以作答
                </p>

                <!-- 答題結果 -->
                <div x-show="showResult" class="text-center">
                    <!-- 正確 -->
                    <div x-show="isCorrect" class="celebrate">
                        <div class="text-8xl mb-4">🎉</div>
                        <h2 class="font-heading text-3xl font-bold text-science mb-4">太棒了！</h2>
                        <div class="clay-card p-4 mb-6 bg-green-50">
                            <p class="text-lg" x-text="currentQuestion.explanation"></p>
                        </div>
                    </div>

                    <!-- 錯誤 -->
                    <div x-show="!isCorrect">
                        <div class="text-6xl mb-4">🤔</div>
                        <h2 class="font-heading text-2xl font-bold text-cta mb-4">再想一下喔！</h2>
                        <button
                            @click="resetQuestion()"
                            class="clay-button bg-cta text-white px-6 py-3 text-xl"
                        >
                            再試一次
                        </button>
                    </div>

                    <!-- 繼續按鈕（正確時） -->
                    <button
                        x-show="isCorrect"
                        @click="nextQuestion()"
                        class="clay-button bg-primary text-white px-8 py-4 text-xl"
                    >
                        繼續探險
                        <i data-lucide="arrow-right" class="w-5 h-5 inline ml-2"></i>
                    </button>
                </div>
            </div>
        </template>

    </main>

    <!-- ===== 設定彈窗 ===== -->
    <div
        x-show="showSettings"
        x-transition
        class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"
        @click.self="showSettings = false"
    >
        <div class="clay-card p-6 w-full max-w-md bg-white" @click.stop>
            <div class="flex items-center justify-between mb-6">
                <h2 class="font-heading text-2xl font-bold">設定</h2>
                <button @click="showSettings = false" class="text-gray-500 hover:text-gray-700">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- 學生姓名 -->
            <div class="mb-6">
                <label class="block font-bold mb-2">你的名字</label>
                <input
                    type="text"
                    x-model="settings.studentName"
                    @change="saveSettings()"
                    class="w-full p-3 border-3 border-primary rounded-xl text-xl"
                    placeholder="輸入你的名字"
                >
            </div>

            <!-- 難度選擇 -->
            <div class="mb-6">
                <label class="block font-bold mb-2">難度</label>
                <div class="flex gap-2">
                    <template x-for="level in ['basic', 'intermediate', 'challenge']" :key="level">
                        <button
                            @click="settings.difficulty = level; saveSettings()"
                            class="clay-button flex-1 py-2 text-sm"
                            :class="settings.difficulty === level ? 'bg-primary text-white' : 'bg-white text-textMain'"
                        >
                            <span x-text="difficultyLabels[level]"></span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- 字體大小 -->
            <div class="mb-6">
                <label class="block font-bold mb-2">字體大小</label>
                <div class="flex gap-2">
                    <template x-for="size in ['small', 'medium', 'large']" :key="size">
                        <button
                            @click="settings.fontSize = size; saveSettings()"
                            class="clay-button flex-1 py-2"
                            :class="settings.fontSize === size ? 'bg-primary text-white' : 'bg-white text-textMain'"
                        >
                            <span x-text="fontSizeLabels[size]"></span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- 重置進度 -->
            <button
                @click="if(confirm('確定要重置所有進度嗎？')) resetProgress()"
                class="clay-button w-full bg-red-500 text-white py-3"
            >
                重置進度
            </button>
        </div>
    </div>

    <!-- ===== 徽章彈窗 ===== -->
    <div
        x-show="showBadges"
        x-transition
        class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50"
        @click.self="showBadges = false"
    >
        <div class="clay-card p-6 w-full max-w-md bg-white" @click.stop>
            <div class="flex items-center justify-between mb-6">
                <h2 class="font-heading text-2xl font-bold">我的徽章</h2>
                <button @click="showBadges = false" class="text-gray-500 hover:text-gray-700">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="grid grid-cols-4 gap-4">
                <template x-for="location in locations" :key="location.id">
                    <div class="text-center">
                        <div
                            class="text-4xl mb-1"
                            :class="isLocationCompleted(location.id) ? '' : 'grayscale opacity-30'"
                        >
                            <span x-text="location.icon"></span>
                        </div>
                        <p class="text-xs" x-text="location.name"></p>
                    </div>
                </template>
            </div>

            <!-- 全部完成獎勵 -->
            <div class="mt-6 text-center" x-show="getOverallProgress() === locations.length">
                <div class="text-6xl mb-2">🏆</div>
                <h3 class="font-heading text-xl font-bold text-cta">國姓探險王！</h3>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                // 頁面狀態
                currentPage: 'home',
                showSettings: false,
                showBadges: false,

                // 選擇狀態
                selectedLocation: null,
                selectedSubject: null,
                currentQuestion: null,
                selectedAnswer: null,
                isCorrect: false,
                showResult: false,
                isListening: false,

                // 設定
                settings: {
                    studentName: '',
                    difficulty: 'basic',
                    fontSize: 'medium',
                },

                // 進度
                progress: {},

                // 標籤對照
                difficultyLabels: {
                    basic: '⭐ 基礎',
                    intermediate: '⭐⭐ 進階',
                    challenge: '⭐⭐⭐ 挑戰'
                },

                fontSizeLabels: {
                    small: '小',
                    medium: '中',
                    large: '大'
                },

                // 學科資料
                subjects: [
                    { id: 'chinese', name: '國語', icon: '📖' },
                    { id: 'math', name: '數學', icon: '🔢' },
                    { id: 'social', name: '社會', icon: '🌍' },
                    { id: 'science', name: '自然', icon: '🔬' },
                ],

                // 地點資料
                locations: [
                    {
                        id: 'bridge',
                        name: '北港溪糯米橋',
                        icon: '🌉',
                        description: '全台灣僅存三座的糯米橋之一，是用石頭、糯米、紅糖黏起來的喔！',
                        subjects: {
                            chinese: {
                                basic: {
                                    question: '這座橋是用石頭和什麼東西黏起來的？',
                                    options: ['強力膠', '糯米紅糖'],
                                    answer: 1,
                                    explanation: '以前沒有水泥，聰明的先人用糯米混合紅糖來黏石頭喔！'
                                },
                                intermediate: {
                                    question: '這座橋是用石頭和什麼東西黏起來的？',
                                    options: ['強力膠', '糯米紅糖', '口香糖'],
                                    answer: 1,
                                    explanation: '以前沒有水泥，聰明的先人用糯米混合紅糖來黏石頭喔！'
                                },
                                challenge: {
                                    question: '糯米橋使用糯米和紅糖作為黏合劑，這種古老的建築方式叫做什麼？',
                                    options: ['水泥工法', '糯米灰漿工法', '現代工法'],
                                    answer: 1,
                                    explanation: '糯米灰漿工法是古代中國人發明的建築技術，比現代水泥還要堅固！'
                                }
                            },
                            math: {

                // 初始化
                init() {
                    this.loadSettings();
                    this.loadProgress();
                    this.$nextTick(() => {
                        lucide.createIcons();
                    });

                    // 鍵盤監聽
                    document.addEventListener('keydown', (e) => this.handleKeyPress(e));
                },

                // 鍵盤處理
                handleKeyPress(e) {
                    if (this.currentPage === 'quiz' && !this.showResult) {
                        if (e.key === '1') this.checkAnswer(0);
                        if (e.key === '2') this.checkAnswer(1);
                        if (e.key === '3' && this.currentQuestion.options.length > 2) this.checkAnswer(2);
                    }
                },

                // 設定相關
                loadSettings() {
                    const saved = localStorage.getItem('guoxing_settings');
                    if (saved) {
                        this.settings = { ...this.settings, ...JSON.parse(saved) };
                    }
                },

                saveSettings() {
                    localStorage.setItem('guoxing_settings', JSON.stringify(this.settings));
                },

                // 進度相關
                loadProgress() {
                    const saved = localStorage.getItem('guoxing_progress');
                    if (saved) {
                        this.progress = JSON.parse(saved);
                    }
                },

                saveProgress() {
                    localStorage.setItem('guoxing_progress', JSON.stringify(this.progress));
                },

                resetProgress() {
                    this.progress = {};
                    this.saveProgress();
                    this.showSettings = false;
                },

                // 進度計算
                isSubjectCompleted(locationId, subjectId) {
                    return this.progress[locationId]?.[subjectId] === true;
                },

                isLocationCompleted(locationId) {
                    const subjects = ['chinese', 'math', 'social', 'science'];
                    return subjects.every(s => this.isSubjectCompleted(locationId, s));
                },

                getLocationProgress(locationId) {
                    const subjects = ['chinese', 'math', 'social', 'science'];
                    return subjects.filter(s => this.isSubjectCompleted(locationId, s)).length;
                },

                getOverallProgress() {
                    return this.locations.filter(loc => this.isLocationCompleted(loc.id)).length;
                },

                // 頁面導航
                selectLocation(location) {
                    this.selectedLocation = location;
                    this.currentPage = 'location';
                    this.$nextTick(() => lucide.createIcons());
                },

                selectSubject(subject) {
                    this.selectedSubject = subject;
                    this.loadQuestion();
                    this.currentPage = 'quiz';
                    this.$nextTick(() => {
                        lucide.createIcons();
                        // 自動朗讀題目
                        setTimeout(() => this.speakText(this.currentQuestion.question), 500);
                    });
                },

                loadQuestion() {
                    const difficulty = this.settings.difficulty;
                    this.currentQuestion = this.selectedLocation.subjects[this.selectedSubject.id][difficulty];
                    this.selectedAnswer = null;
                    this.isCorrect = false;
                    this.showResult = false;
                },

                // 答題邏輯
                checkAnswer(index) {
                    if (this.selectedAnswer !== null) return;

                    this.selectedAnswer = index;
                    this.isCorrect = index === this.currentQuestion.answer;

                    if (this.isCorrect) {
                        // 記錄進度
                        if (!this.progress[this.selectedLocation.id]) {
                            this.progress[this.selectedLocation.id] = {};
                        }
                        this.progress[this.selectedLocation.id][this.selectedSubject.id] = true;
                        this.saveProgress();

                        // 播放成功語音
                        setTimeout(() => this.speakText('太棒了！答對了！'), 300);
                    } else {
                        // 播放提示語音
                        setTimeout(() => this.speakText('再想一下喔！'), 300);
                    }

                    setTimeout(() => {
                        this.showResult = true;
                        this.$nextTick(() => lucide.createIcons());
                    }, 500);
                },

                resetQuestion() {
                    this.selectedAnswer = null;
                    this.isCorrect = false;
                    this.showResult = false;
                    setTimeout(() => this.speakText(this.currentQuestion.question), 300);
                },

                nextQuestion() {
                    // 返回地點頁面
                    this.currentPage = 'location';
                    this.$nextTick(() => lucide.createIcons());
                },

                // 語音朗讀
                speakText(text) {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'zh-TW';
                        utterance.rate = 0.8;
                        utterance.pitch = 1.1;
                        window.speechSynthesis.speak(utterance);
                    }
                },

                // 語音辨識
                startVoiceRecognition() {
                    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                        alert('您的瀏覽器不支援語音辨識功能');
                        return;
                    }

                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'zh-TW';
                    recognition.interimResults = false;

                    this.isListening = true;

                    recognition.onresult = (event) => {
                        const result = event.results[0][0].transcript.toLowerCase();
                        this.isListening = false;

                        // 檢查是否符合任何選項
                        const options = this.currentQuestion.options;

                        // 檢查數字
                        if (result.includes('一') || result.includes('1') || result.includes('第一')) {
                            this.checkAnswer(0);
                        } else if (result.includes('二') || result.includes('2') || result.includes('第二')) {
                            this.checkAnswer(1);
                        } else if (result.includes('三') || result.includes('3') || result.includes('第三')) {
                            if (options.length > 2) this.checkAnswer(2);
                        } else {
                            // 檢查選項內容
                            for (let i = 0; i < options.length; i++) {
                                if (result.includes(options[i].toLowerCase()) ||
                                    options[i].toLowerCase().includes(result)) {
                                    this.checkAnswer(i);
                                    return;
                                }
                            }
                            this.speakText('我沒有聽清楚，請再說一次');
                        }
                    };

                    recognition.onerror = () => {
                        this.isListening = false;
                        this.speakText('語音辨識失敗，請再試一次');
                    };

                    recognition.onend = () => {
                        this.isListening = false;
                    };

                    recognition.start();

                    // 5秒超時
                    setTimeout(() => {
                        if (this.isListening) {
                            recognition.stop();
                            this.isListening = false;
                        }
                    }, 5000);
                }
            }
        }
